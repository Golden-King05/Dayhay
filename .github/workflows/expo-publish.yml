name: Publish to Expo

on:
  push:
    branches:
      - claude/hay-day-iphone-optimizer-spxdb1
      - main

jobs:
  publish:
    name: Publish app to Expo Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Initialize EAS project (first run only)
        run: npx eas init --non-interactive --force
        continue-on-error: true

      - name: Publish update to Expo
        run: npx eas update --branch production --message "Deploy from GitHub Actions" --non-interactive
